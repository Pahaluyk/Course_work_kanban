<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация — Task Tracker</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">TASK TRACKER</h1>
      <p class="auth-card__sub">Создайте аккаунт</p>
    </div>

    <form class="auth-form" id="form-register">
      <div class="form-group">
        <label class="form-label">Логин</label>
        <input class="form-input" type="text" id="username" placeholder="your_login" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" id="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required />
      </div>
      <div class="form-group">
        <label class="form-label">Роль</label>
        <select class="form-input" id="role">
          <option value="developer">Разработчик</option>
          <option value="manager">Менеджер</option>
          <option value="observer">Наблюдатель</option>
        </select>
      </div>
      <div class="alert alert--error" id="reg-error" style="display:none"></div>
      <div class="alert alert--success" id="reg-success" style="display:none"></div>
      <button class="btn btn--primary btn--full" type="submit">Зарегистрироваться</button>
    </form>

    <p class="auth-card__footer">
      Уже есть аккаунт? <a href="/auth/login">Войти</a>
    </p>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById('form-register').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('reg-error');
      const okEl = document.getElementById('reg-success');
      errEl.style.display = 'none';
      okEl.style.display = 'none';
      try {
        await api.post('/auth/register', {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.getElementById('role').value,
        });
        okEl.textContent = 'Регистрация успешна! Перенаправление...';
        okEl.style.display = 'block';
        setTimeout(() => window.location.href = '/auth/login', 1200);
      } catch (err) {
        errEl.textContent = err.message || 'Ошибка регистрации';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
