<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход — Task Tracker</title>
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1 class="auth-card__title">TASK TRACKER</h1>
      <p class="auth-card__sub">Войдите в свой аккаунт</p>
    </div>

    <form class="auth-form" id="form-login">
      <div class="form-group">
        <label class="form-label">Логин</label>
        <input class="form-input" type="text" id="username" placeholder="your_login" required />
      </div>
      <div class="form-group">
        <label class="form-label">Пароль</label>
        <input class="form-input" type="password" id="password" placeholder="••••••••" required />
      </div>
      <div class="alert alert--error" id="login-error" style="display:none"></div>
      <button class="btn btn--primary btn--full" type="submit">Войти</button>
    </form>

    <p class="auth-card__footer">
      Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a>
    </p>
  </div>

  <script src="/static/js/api.js"></script>
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('login-error');
      errEl.style.display = 'none';
      try {
        const data = await api.post('/auth/login', {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        });
        localStorage.setItem('user', JSON.stringify(data.user));
        localStorage.setItem('token', data.access_token);
        window.location.href = '/projects/';
      } catch (err) {
        errEl.textContent = err.message || 'Ошибка входа';
        errEl.style.display = 'block';
      }
    });
  </script>
</body>
</html>
